<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AURELIA | Fine Jewelry</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bg: #f7f1eb;
      --panel: #f3e7de;
      --white: #fffdfb;
      --ink: #1b1715;
      --muted: #6a5d57;
      --line: rgba(27,23,21,0.12);
      --gold: #b9996b;
      --gold-deep: #8d6d43;
      --gold-soft: #d7c09a;
      --shadow: 0 20px 60px rgba(33, 24, 18, 0.08);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: "Inter", sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    img {
      width: 100%;
      display: block;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; }

    .container {
      width: min(1200px, calc(100% - 40px));
      margin: 0 auto;
    }

    .topbar {
      border-bottom: 1px solid var(--line);
      background: rgba(247,241,235,0.85);
      backdrop-filter: blur(7px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .topbar-inner {
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: "Cormorant Garamond", serif;
      letter-spacing: 0.12em;
      font-size: clamp(1.8rem, 2.2vw, 2.5rem);
      font-weight: 600;
    }

    .brand-mark {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold-soft), var(--gold));
      box-shadow: 0 0 0 4px rgba(185, 153, 107, 0.15);
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 28px;
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .nav a {
      position: relative;
      transition: color 0.25s ease;
    }

    .nav a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -8px;
      width: 100%;
      height: 1px;
      background: var(--gold);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.25s ease;
    }

    .nav a:hover { color: var(--ink); }
    .nav a:hover::after { transform: scaleX(1); }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .icon-button {
      width: 42px;
      height: 42px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.4);
      border-radius: 50%;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .icon-button:hover {
      transform: translateY(-1px);
      border-color: rgba(185, 153, 107, 0.5);
    }

    .icon-button svg {
      width: 18px;
      height: 18px;
      stroke: var(--ink);
    }

    .cart-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 18px;
      height: 42px;
      border-radius: 999px;
      border: 1px solid var(--ink);
      background: var(--ink);
      color: var(--white);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: 0.7rem;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .cart-pill:hover {
      transform: translateY(-1px);
      background: #2d2624;
    }

    .hero {
      padding: 54px 0 36px;
    }

    .hero-inner {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 56px;
      align-items: center;
    }

    .eyebrow {
      display: inline-block;
      color: var(--gold-deep);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-size: 0.72rem;
      margin-bottom: 18px;
    }

    h1 {
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(3.3rem, 7vw, 7rem);
      line-height: 0.9;
      margin: 0 0 20px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .hero-copy p {
      max-width: 520px;
      margin: 0 0 28px;
      color: var(--muted);
      line-height: 1.8;
      font-size: 1rem;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 34px;
    }

    .primary-btn, .secondary-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      height: 52px;
      padding: 0 28px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: 0.72rem;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
    }

    .primary-btn {
      background: linear-gradient(135deg, var(--gold), var(--gold-deep));
      color: #fff;
      box-shadow: 0 20px 35px rgba(141, 109, 67, 0.28);
    }

    .secondary-btn {
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.35);
      color: var(--ink);
    }

    .primary-btn:hover, .secondary-btn:hover {
      transform: translateY(-1px);
    }

    .hero-stats {
      display: flex;
      gap: 42px;
      flex-wrap: wrap;
    }

    .stat-box {
      min-width: 120px;
    }

    .stat-value {
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(2rem, 3vw, 3rem);
      font-weight: 600;
      line-height: 1;
      margin-bottom: 8px;
    }

    .stat-label {
      color: var(--muted);
      font-size: 0.74rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .hero-visual {
      position: relative;
      min-height: 650px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .image-main {
      width: min(540px, 100%);
      height: 620px;
      border-radius: 28px 28px 140px 28px;
      overflow: hidden;
      box-shadow: var(--shadow);
      position: relative;
      border: 1px solid rgba(27,23,21,0.08);
    }

    .image-main img {
      height: 100%;
      object-fit: cover;
    }

    .floating-card {
      position: absolute;
      bottom: 40px;
      left: 30px;
      background: rgba(255,255,255,0.72);
      backdrop-filter: blur(9px);
      border: 1px solid rgba(27,23,21,0.08);
      box-shadow: 0 20px 35px rgba(27,23,21,0.08);
      border-radius: 24px;
      padding: 18px 18px 14px;
      width: 230px;
    }

    .floating-label {
      font-size: 0.63rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .floating-name {
      font-family: "Cormorant Garamond", serif;
      font-size: 2rem;
      margin-bottom: 6px;
    }

    .floating-price {
      color: var(--gold-deep);
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.74rem;
    }

    .badge {
      position: absolute;
      right: 20px;
      top: 28px;
      background: rgba(255,255,255,0.8);
      border: 1px solid rgba(27,23,21,0.08);
      color: var(--ink);
      padding: 12px 16px;
      border-radius: 999px;
      font-size: 0.68rem;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      backdrop-filter: blur(8px);
    }

    .section {
      padding: 54px 0;
    }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 28px;
    }

    .section-title {
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(2.6rem, 4vw, 4rem);
      font-weight: 600;
      margin: 0;
      letter-spacing: -0.02em;
    }

    .section-link {
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: 0.7rem;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 30px;
    }

    .chip {
      height: 38px;
      padding: 0 18px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.2);
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.68rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .chip.active, .chip:hover {
      background: var(--ink);
      color: var(--white);
      border-color: var(--ink);
    }

    .products {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 26px;
    }

    .product-card {
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(27,23,21,0.08);
      border-radius: 24px;
      overflow: hidden;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 18px 40px rgba(27,23,21,0.08);
    }

    .product-image {
      position: relative;
      height: 360px;
      overflow: hidden;
      background: #ede2d7;
    }

    .product-image img {
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .product-card:hover .product-image img {
      transform: scale(1.04);
    }

    .product-tag {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(255,255,255,0.8);
      border: 1px solid rgba(27,23,21,0.08);
      border-radius: 999px;
      padding: 8px 10px;
      font-size: 0.62rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink);
      backdrop-filter: blur(8px);
    }

    .product-info {
      padding: 18px 18px 20px;
    }

    .product-name {
      font-family: "Cormorant Garamond", serif;
      font-size: 2rem;
      margin: 0 0 6px;
      line-height: 1;
    }

    .product-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .product-category {
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .product-price {
      font-size: 0.9rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gold-deep);
      font-weight: 700;
    }

    .product-actions {
      display: flex;
      gap: 10px;
    }

    .wishlist, .add-cart {
      flex: 1;
      height: 42px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: transparent;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink);
    }

    .add-cart {
      background: var(--ink);
      color: var(--white);
      border-color: var(--ink);
    }

    .wishlist:hover {
      border-color: rgba(185, 153, 107, 0.55);
      color: var(--gold-deep);
    }

    .add-cart:hover {
      background: #2b2421;
    }

    .story {
      padding: 38px 0 0;
    }

    .story-wrap {
      background: linear-gradient(135deg, rgba(255,255,255,0.38), rgba(255,255,255,0.12));
      border: 1px solid rgba(27,23,21,0.08);
      border-radius: 32px;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      min-height: 520px;
    }

    .story-image {
      position: relative;
      min-height: 520px;
    }

    .story-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .story-content {
      display: flex;
      align-items: center;
      padding: 56px 44px;
    }

    .story-box {
      max-width: 470px;
    }

    .story-box .eyebrow {
      margin-bottom: 18px;
    }

    .story-box h3 {
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(2.6rem, 4vw, 4rem);
      margin: 0 0 16px;
      line-height: 1;
    }

    .story-box p {
      margin: 0 0 28px;
      color: var(--muted);
      line-height: 1.8;
    }

    .quote {
      display: flex;
      align-items: center;
      gap: 18px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
    }

    .quote-mark {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold-soft), var(--gold));
      color: #fff;
      display: grid;
      place-items: center;
      font-family: "Cormorant Garamond", serif;
      font-size: 1.8rem;
      line-height: 1;
    }

    .quote small {
      display: block;
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: 0.66rem;
      margin-top: 4px;
    }

    .collections {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 24px;
    }

    .collection-card {
      position: relative;
      overflow: hidden;
      border-radius: 28px;
      min-height: 470px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(27,23,21,0.08);
    }

    .collection-card img {
      height: 100%;
      object-fit: cover;
    }

    .collection-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(16,12,10,0.06), rgba(16,12,10,0.68));
      display: flex;
      align-items: end;
      padding: 26px;
    }

    .collection-text {
      color: #fff;
    }

    .collection-text .name {
      font-family: "Cormorant Garamond", serif;
      font-size: 2.6rem;
      line-height: 1;
      margin-bottom: 8px;
    }

    .collection-text .sub {
      font-size: 0.7rem;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.75);
    }

    .journal {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 24px;
    }

    .article {
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(27,23,21,0.08);
      border-radius: 26px;
      overflow: hidden;
    }

    .article-image {
      height: 250px;
      overflow: hidden;
    }

    .article-image img {
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .article:hover .article-image img {
      transform: scale(1.04);
    }

    .article-body {
      padding: 22px 20px 26px;
    }

    .article-kicker {
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gold-deep);
      margin-bottom: 12px;
    }

    .article h4 {
      font-family: "Cormorant Garamond", serif;
      font-size: 2rem;
      margin: 0 0 12px;
      line-height: 1;
    }

    .article p {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
      font-size: 0.95rem;
    }

    .newsletter {
      margin-top: 18px;
      background: linear-gradient(135deg, rgba(185,153,107,0.16), rgba(255,255,255,0.28));
      border: 1px solid rgba(27,23,21,0.08);
      border-radius: 30px;
      padding: 42px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    .newsletter h3 {
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(2rem, 3vw, 3.2rem);
      margin: 0;
      line-height: 1;
    }

    .newsletter-form {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .newsletter input {
      width: min(400px, 70vw);
      height: 54px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.46);
      padding: 0 18px;
      color: var(--ink);
      outline: none;
    }

    .newsletter button {
      height: 54px;
      border: 0;
      border-radius: 999px;
      padding: 0 24px;
      background: var(--ink);
      color: var(--white);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: 0.7rem;
      cursor: pointer;
    }

    footer {
      padding: 34px 0 60px;
    }

    .footer-wrap {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      border-top: 1px solid var(--line);
      padding-top: 24px;
      flex-wrap: wrap;
    }

    .footer-nav {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 0.74rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .copy {
      color: var(--muted);
      font-size: 0.8rem;
      letter-spacing: 0.06em;
    }

    @media (max-width: 1024px) {
      .hero-inner,
      .story-wrap {
        grid-template-columns: 1fr;
      }

      .products {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .collections,
      .journal {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 760px) {
      .nav {
        display: none;
      }

      .topbar-inner {
        justify-content: space-between;
      }

      .products {
        grid-template-columns: 1fr;
      }

      .actions {
        flex-wrap: wrap;
      }

      .hero {
        padding-top: 36px;
      }

      .hero-visual {
        min-height: 540px;
      }

      .image-main {
        height: 500px;
      }

      .floating-card {
        left: 12px;
        bottom: 18px;
      }

      .newsletter {
        padding: 30px 20px;
      }

      .newsletter-form {
        width: 100%;
      }

      .newsletter input {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <div class="brand">
        <span class="brand-mark"></span>
        AURELIA
      </div>

      <nav class="nav">
        <a href="#">Collection</a>
        <a href="#">Rings</a>
        <a href="#">Necklaces</a>
        <a href="#">Bracelets</a>
        <a href="#">Watches</a>
        <a href="#">Gifts</a>
      </nav>

      <div class="nav-actions">
        <button class="icon-button" aria-label="Search">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="6"></circle>
            <path d="M16 16L21 21"></path>
          </svg>
        </button>

        <button class="icon-button" aria-label="Account">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21a8 8 0 0 0-16 0"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </button>

        <button class="cart-pill">Cart (<span id="cartCount">0</span>)</button>
      </*
