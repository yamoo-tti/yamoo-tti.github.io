<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 첫 깃허브 홈페이지</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
        }
        h1 {
            color: #24292e;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            font-size: 1.1rem;
        }
        .links {
            margin-top: 20px;
        }
        .btn {
            display: inline-block;
            background: #2ea44f;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #2c974b;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>👋 안녕하세요!</h1>
        <p>GitHub Pages로 만든 저의 첫 번째 홈페이지입니다.</p>
        <p>앞으로 이곳에 멋진 콘텐츠를 채워나갈 예정입니다.</p>
        
        <div class="links">
            <!-- 이동하고 싶은 링크가 있다면 href="" 안에 주소를 적으세요 -->
            <a href="https://github.com" target="_blank" class="btn">내 깃허브 방문하기</a>
        </div>
    </div>

</body>
</html>
